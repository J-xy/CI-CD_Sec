name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1' # Runs every Monday at 04:00 UTC

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scanning:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  iac-scanning:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          output_format: sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: checkov-iac

  container-scanning:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t demo-app:latest ./app

      - name: Run Trivy Filesystem Scan (Advisory)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs

      - name: Run Trivy Image Scan (Advisory SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'demo-app:latest'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image

      - name: Run Trivy Blocking Gate (Critical with Fixes)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'demo-app:latest'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: container-scanning
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Image for SBOM
        run: docker build -t demo-app:latest ./app

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/syft-action@v7
        with:
          image-ref: "demo-app:latest"
          format: "cyclonedx-json"
          output-file: "sbom-cyclonedx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-sbom
          path: sbom-cyclonedx.json
          retention-days: 90